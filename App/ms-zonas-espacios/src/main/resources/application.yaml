spring:
  application:
    name: zonas-espacios
  datasource:
    url: jdbc:mysql://localhost:3307/db_zonas_espacios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: espe_user
    password: espe_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8082

# Actuator: solo health e info se exponen (probes de Kubernetes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Documentacion OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  tenants: ${APP_TENANTS:empresa-a,empresa-b}
  jwt:
    secret: ${JWT_SECRET:9a7f34c2d6e9f1a0b3c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6}
  # Configuracion de auditoria: debe coincidir con el consumidor de ms-audith
  audit:
    exchange: ${RABBITMQ_EXCHANGE:audit_exchange}
    routing-key: ${RABBITMQ_ROUTING_KEY:audit_routing_key}
    servicio: ms-zonas

# TTL (segundos) del cache de espacios en Redis
redis:
  ttl: ${REDIS_TTL:60}
