# Configuracion exclusiva de las pruebas.
#
# Sustituye PostgreSQL por H2 en memoria para que la prueba de contexto se
# ejecute en CI sin infraestructura externa, y desactiva las tareas de arranque
# (migracion y siembra) porque usan DDL propio del motor.
spring:
  datasource:
    url: jdbc:h2:mem:usuarios_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # La conexion a RabbitMQ es perezosa: no se abre al cargar el contexto.
  rabbitmq:
    host: localhost
    port: 5672

app:
  bootstrap:
    enabled: false
  tenants: empresa-a,empresa-b
  jwt:
    secret: clave-de-pruebas-9a7f34c2d6e9f1a0b3c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3
    issuer: parqueadero-auth
