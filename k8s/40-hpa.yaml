# Escalado horizontal automatico e independiente por microservicio.
#
# Requiere metrics-server en el cluster:
#   minikube addons enable metrics-server
#
# ms-zonas y ms-tickets quedan deliberadamente fuera: mantienen los emisores
# SSE en memoria del pod, de modo que escalarlos repartiria a los clientes
# entre replicas que no comparten estado. Ver la nota en k8s/README.md.
#
# IMPORTANTE - ventana de estabilizacion al escalar hacia arriba:
# una JVM recien arrancada consume el 100% de su CPU durante 1-2 minutos. Sin
# ventana de estabilizacion el HPA interpreta ese pico como carga real, crea
# mas replicas, y cada replica nueva repite el pico: el nodo se queda sin CPU
# y ningun pod llega a estar listo (bucle de realimentacion). Los 300s de
# stabilizationWindowSeconds hacen que el HPA ignore el arranque y solo
# reaccione a carga sostenida.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-usuarios-hpa
  namespace: parqueadero
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-usuarios
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Ignora los picos de arranque de la JVM; solo escala con carga sostenida.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
