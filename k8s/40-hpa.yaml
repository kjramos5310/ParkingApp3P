# Escalado horizontal automatico e independiente por microservicio.
#
# Requiere metrics-server en el cluster:
#   minikube addons enable metrics-server
#
# ms-zonas y ms-tickets quedan deliberadamente fuera: mantienen los emisores
# SSE en memoria del pod, de modo que escalarlos repartiria a los clientes
# entre replicas que no comparten estado. Ver la nota en k8s/README.md.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-usuarios-hpa
  namespace: parqueadero
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-usuarios
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-vehiculos-hpa
  namespace: parqueadero
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-vehiculos
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-audith-hpa
  namespace: parqueadero
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-audith
  minReplicas: 2
  maxReplicas: 8 # el volumen de eventos crece con el numero de tenants
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
