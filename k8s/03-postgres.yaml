# PostgreSQL: aloja una base de datos independiente por microservicio
# (usuarios_db, vehiculos_db, tickets_db, db_audit).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: parqueadero
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Script de inicializacion: crea una BD por microservicio en el primer arranque.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: parqueadero
data:
  postgres-init.sql: |
    CREATE DATABASE usuarios_db;
    CREATE DATABASE vehiculos_db;
    CREATE DATABASE tickets_db;
    CREATE DATABASE db_audit;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: parqueadero
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate # un solo volumen RWO: no puede haber dos pods a la vez
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
            # Los datos van a un subdirectorio: el PVC monta un lost+found
            # en la raiz que impide a initdb inicializar el cluster.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: parqueadero
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
