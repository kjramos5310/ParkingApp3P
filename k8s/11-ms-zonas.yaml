# MS-Zonas y Espacios (Spring Boot): distribucion fisica del parqueadero.
# Emite el stream SSE de disponibilidad y publica eventos a RabbitMQ.
# Persiste en MySQL y cachea la lista de espacios en redis-zonas.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-zonas
  namespace: parqueadero
  labels:
    app: ms-zonas
    tier: backend
spec:
  progressDeadlineSeconds: 1200
  # NOTA: los emisores SSE se mantienen en memoria de cada pod. Con mas de una
  # replica un cliente solo recibe los eventos generados por el pod al que quedo
  # conectado. Para escalar horizontalmente el stream hay que difundir los
  # eventos por RabbitMQ (fan-out) hacia todas las replicas. Ver k8s/README.md.
  replicas: 1
  selector:
    matchLabels:
      app: ms-zonas
  template:
    metadata:
      labels:
        app: ms-zonas
        tier: backend
    spec:
      containers:
        - name: ms-zonas
          image: parkingapp/ms-zonas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: 'true'
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/db_zonas_espacios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parking-secrets
                  key: RABBITMQ_PASSWORD
            - name: REDIS_HOST
              value: redis-zonas
            - name: REDIS_PORT
              value: "6379"
          envFrom:
            - configMapRef:
                name: parking-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-zonas
  namespace: parqueadero
spec:
  type: ClusterIP
  selector:
    app: ms-zonas
  ports:
    - port: 8082
      targetPort: 8082
