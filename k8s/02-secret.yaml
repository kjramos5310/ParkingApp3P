# Credenciales del sistema.
#
# ADVERTENCIA: este archivo se versiona solo por tratarse de un entorno de
# demostracion academica. En un despliegue real estos valores deben crearse
# fuera de Git (kubectl create secret / Sealed Secrets / External Secrets):
#
#   kubectl -n parqueadero create secret generic parking-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" ...
#
# stringData permite escribir los valores en texto plano; Kubernetes los
# codifica en base64 al persistirlos.
apiVersion: v1
kind: Secret
metadata:
  name: parking-secrets
  namespace: parqueadero
type: Opaque
stringData:
  # Clave HMAC compartida para firmar y validar los JWT en todos los servicios.
  JWT_SECRET: "9a7f34c2d6e9f1a0b3c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6"

  # PostgreSQL (usuarios, vehiculos, tickets, auditoria)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # MySQL (zonas y espacios)
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_USER: "espe_user"
  MYSQL_PASSWORD: "espe_password"

  # RabbitMQ
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "admin123"

  # Cuenta de servicio que ms-tickets usa para autenticarse contra ms-usuarios
  SERVICE_USER: "admin"
  SERVICE_PASSWORD: "admin123"
