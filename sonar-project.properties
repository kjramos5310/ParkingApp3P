sonar.organization=kjramos5310
sonar.projectKey=kjramos5310_ParkingApp3P
sonar.projectName=ParkingApp3P

# Fuentes de TODOS los microservicios (Java + NestJS) y del frontend
sonar.sources=App/ms-usuarios-roles-auth/src/main,App/ms-zonas-espacios/src/main,App/ms-vehiculos/src,App/ms-tickets/src,App/ms-audith/src,Frontend/src

# Pruebas
sonar.tests=App/ms-usuarios-roles-auth/src/test,App/ms-zonas-espacios/src/test
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java

# Codificación
sonar.sourceEncoding=UTF-8

# Binarios Java (necesario para que Sonar analice el bytecode compilado)
sonar.java.binaries=App/ms-usuarios-roles-auth/target/classes,App/ms-zonas-espacios/target/classes

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.spec.ts,**/test/**,**/*.test.ts,App/ms-zonas-espacios/ms-zonas-espacios/**,clasefrontend/**

# Exclusión de cobertura (evita que falle el Quality Gate por no tener 80% de cobertura).
# Para empezar a medirla, elimina esta línea y publica los reportes:
#   Java -> mvn jacoco:report + sonar.coverage.jacoco.xmlReportPaths
#   Nest -> jest --coverage   + sonar.javascript.lcov.reportPaths
sonar.coverage.exclusions=**/*
