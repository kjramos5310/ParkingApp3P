# ============================================================================
# ParkingApp3P - Infraestructura (bases de datos + mensajería)
# ----------------------------------------------------------------------------
# Este compose levanta SOLO la infraestructura que necesitan los
# microservicios (una base de datos por servicio + RabbitMQ para auditoría).
# Los microservicios (Spring Boot / NestJS) se ejecutan localmente contra
# estos puertos (ver los .env de cada ms y los application.yml de Java).
#
#   Uso:  docker compose up -d
#
# Puertos de host elegidos para NO chocar con servicios nativos de Windows
# (PostgreSQL 18 ya ocupa 5432 y MySQL ocupa 3306/3307 en esta máquina).
# ============================================================================

services:
  # --- ms-usuarios-roles-auth (Spring Boot) -> jdbc:postgresql://localhost:5434/usuarios_db
  postgres-usuarios:
    image: postgres:15
    container_name: postgres-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usuarios_db
    ports:
      - "5434:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    networks:
      - parking-network

  # --- ms-tickets (NestJS) -> localhost:5433 / tickets_db
  postgres-tickets:
    image: postgres:15
    container_name: postgres-tickets
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets_db
    ports:
      - "5433:5432"
    volumes:
      - tickets_data:/var/lib/postgresql/data
    networks:
      - parking-network

  # --- ms-vehiculos (NestJS) -> localhost:5435 / vehiculos_db
  vehiculos-postgres:
    image: postgres:15-alpine
    container_name: vehiculos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehiculos_db
    ports:
      - "5435:5432"
    volumes:
      - vehiculos_data:/var/lib/postgresql/data
    networks:
      - parking-network

  # --- ms-audith (NestJS) -> localhost:5436 / db_audit
  db-audit:
    image: postgres:latest
    container_name: db_audit
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_audit
    ports:
      - "5436:5432"
    volumes:
      # postgres:latest es PostgreSQL 18: el volumen se monta en /var/lib/postgresql
      # (no en /data) por el nuevo esquema de directorios por versión mayor.
      - audit_data:/var/lib/postgresql
    networks:
      - parking-network

  # --- ms-zonas-espacios (Spring Boot) -> jdbc:mysql://localhost:3309/db_zonas_espacios
  mysql-zonas:
    image: mysql:8.0
    container_name: mysql-zonas-espacios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_zonas_espacios
      MYSQL_USER: espe_user
      MYSQL_PASSWORD: espe_password
    ports:
      - "3309:3306"
    volumes:
      - zonas_data:/var/lib/mysql
    networks:
      - parking-network

  # --- RabbitMQ (usado por ms-vehiculos como publisher y ms-audith como consumer)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Consola de administración web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - parking-network

networks:
  parking-network:
    driver: bridge

volumes:
  usuarios_data:
  tickets_data:
  vehiculos_data:
  audit_data:
  zonas_data:
  rabbitmq_data:
